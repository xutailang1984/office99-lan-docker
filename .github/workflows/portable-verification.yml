name: Portable verification
on:
  push:
    branches: [main, mac-handoff-050]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Node and browser (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      - name: Verify deployable files and install dependencies
        run: |
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
          mkdir -p release/docker-data
          node release/tools/verify-docker-release.mjs release
          npm --prefix server ci --omit=optional
      - name: Launch, create rooms and restart on macOS
        run: node tools/test-local-deploy.mjs
      - name: Verify game rules
        run: npm --prefix server test
      - name: Install pinned Godot and web export templates
        id: godot
        if: ${{ !cancelled() && matrix.arch == 'arm64' }}
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          dir="$RUNNER_TEMP/office99-godot"
          templates="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$dir" "$templates"
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_macos.universal.zip" -o "$dir/godot.zip"
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o "$dir/templates.tpz"
          (cd "$dir" && shasum -a 256 -c <<'EOF'
          c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  godot.zip
          f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz
          EOF
          )
          unzip -q "$dir/godot.zip" -d "$dir"
          unzip -jo "$dir/templates.tpz" templates/version.txt templates/web_nothreads_release.zip -d "$templates"
          echo "GODOT_EXE=$dir/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
      - name: Rebuild the web game from editable sources
        if: ${{ !cancelled() && steps.godot.outcome == 'success' }}
        run: node tools/build-candidate.mjs .runtime/dev-web
      - name: Verify both scenes and input in Chromium
        if: '!cancelled()'
        run: |
          npm --prefix .runtime/browser install --no-save --no-audit playwright@1.58.2
          node .runtime/browser/node_modules/playwright/cli.js install --no-shell chromium
          node tools/test-local-deploy.mjs --browser

  docker:
    name: Docker deploy (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: office99-portable-test
      OFFICE99_PORT: 18085
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy through the user script and verify rooms
        shell: bash
        run: |
          set -euo pipefail
          export OFFICE99_DATA_DIR="$RUNNER_TEMP/office99-data"
          npm --prefix server ci --omit=optional
          bash ./deploy.sh --port "$OFFICE99_PORT" --data-dir "$OFFICE99_DATA_DIR"
          test "$(docker image inspect office99-lan:moba-050 --format '{{.Architecture}}')" = "${{ matrix.arch }}"
          node tools/smoke-portable.mjs "http://127.0.0.1:$OFFICE99_PORT" --isolated
      - name: Stop test service
        if: always()
        shell: bash
        run: |
          export OFFICE99_DATA_DIR="$RUNNER_TEMP/office99-data"
          if [[ "${{ job.status }}" == failure ]]; then docker compose -f release/compose.yaml logs --tail 25; fi
          docker compose -f release/compose.yaml down



