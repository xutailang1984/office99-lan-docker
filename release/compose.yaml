name: office99

services:
  game:
    image: office99-lan:local
    pull_policy: never
    ports:
      - "${OFFICE99_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${OFFICE99_DATA_DIR:-./docker-data}
        target: /data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 60s
